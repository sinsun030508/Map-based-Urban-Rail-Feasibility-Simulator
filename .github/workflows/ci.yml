# 푸시·PR 마다 세 묶음의 테스트를 깨끗한 환경에서 돌린다.
#
# 왜: 로컬은 .env·내려받은 캐시·빌드 산출물이 있어 테스트가 몰래 거기 기대도 통과한다. CI 는 저장소에
# 올라간 파일만 있다 — 처음 붙일 때 requirements.txt 에 shapely·pytest 가 빠져 있던 것을 이렇게 찾았다.
# 세 묶음은 서로 독립 job 이라 하나가 깨져도 나머지 결과가 보인다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  etl:
    name: ETL (pytest)
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - run: pip install -r etl/requirements.txt
      # test_no_secrets 의 .env 대조는 CI 에 .env 가 없어 건너뛴다(의도) — 나머지 비밀값 검사는 돈다
      - run: python -m pytest -q
        working-directory: etl

  backend:
    name: Backend (mvn test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pom.xml 의 java.version 과 같게 — 로컬은 21 이라 17 에 없는 문법을 쓰면 여기서 걸린다
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # mvnw 에 실행 권한이 없다(모드 100644) — bash 로 부른다
      - run: bash ./mvnw -B -q test
        working-directory: backend

  frontend:
    name: Frontend (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 테스트는 의존성 없이 node --test 로만 돈다 — npm install 이 필요 없다
      - run: npm test
        working-directory: frontend

  # 배포 이미지가 빌드되는지 — Dockerfile·nginx 설정이 깨지면 EC2 에서가 아니라 여기서 안다
  images:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -q -t railfeas-backend ./backend
      - run: docker build -q -t railfeas-web ./frontend
      - name: nginx 설정 검사
        run: docker run --rm --add-host backend:127.0.0.1 -e VWORLD_KEY=test -e VWORLD_REFERER=http://localhost/ --entrypoint sh railfeas-web -c "/docker-entrypoint.d/20-envsubst-on-templates.sh && nginx -t"
