server:
  compression:
    # 인구 집계구 응답이 수 MB 라 압축이 필요하다 (JSON 배열이라 잘 줄어든다)
    enabled: true
    mime-types: application/json
    min-response-size: 8KB

spring:
  application:
    name: railfeas
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/railfeas?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:railfeas}
  jpa:
    hibernate:
      # 스키마는 db/schema/*.sql 이 만든다. JPA 가 손대지 못하게 validate 로 고정
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
app:
  # ETL 산출물을 그대로 읽는다. 없으면 수요·B/C 가 비고 결과에 경고가 붙는다
  census-file: ${CENSUS_FILE:../data/build/census_population.csv}
  worker-file: ${WORKER_FILE:../data/build/dong_workers.csv}
  # 기존 노선 활용 안내용 역 좌표 (etl/seoul_ridership.py 산출)
  station-file: ${STATION_FILE:../data/build/station_master.csv}
  jwt:
    # 개발용 기본값 — 운영에서는 반드시 환경변수로 교체할 것 (HS256 이므로 32바이트 이상)
    secret: ${JWT_SECRET:railfeas-local-dev-secret-key-change-me-32bytes}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:720}
  oauth2:
    # 소셜 로그인 성공 후 토큰을 붙여 보낼 프론트엔드 주소
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth/callback}

logging:
  level:
    com.railfeas: DEBUG
