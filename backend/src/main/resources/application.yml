spring:
  application:
    name: railfeas
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/railfeas?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:railfeas}
  jpa:
    hibernate:
      # 스키마는 db/schema/*.sql 이 만든다. JPA 가 손대지 못하게 validate 로 고정
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: profile, email
          kakao:
            client-id: ${KAKAO_CLIENT_ID:}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            scope: profile_nickname, account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

app:
  jwt:
    # 개발용 기본값 — 운영에서는 반드시 환경변수로 교체할 것 (HS256 이므로 32바이트 이상)
    secret: ${JWT_SECRET:railfeas-local-dev-secret-key-change-me-32bytes}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:720}
  oauth2:
    # 소셜 로그인 성공 후 토큰을 붙여 보낼 프론트엔드 주소
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth/callback}

logging:
  level:
    com.railfeas: DEBUG
